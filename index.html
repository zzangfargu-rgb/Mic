<!DOCTYPE html>

<style>

@media (prefers-color-scheme:dark){:root{--bg:#0d192d;--surface:#152540;--surface2:#1b2d4c;--ink:#e8eef7;--ink2:#a8b7ce;--line:#2a3e5f;--lotus:#f27aa5;--lotus-ink:#0d192d;--jade:#56c9b6;--gold:#e6bb55;--bad:#ff8a80;--ok:#56c9b6;color-scheme:dark}}

<body>
<header><h1>한베영 단어장 · 발음 점검</h1><small>마이크가 막히는 환경을 위한 전용 페이지예요</small></header>
<main>
  <section class="panel" id="left">
    <h2>설정</h2>
    <div class="field" id="apiBox" hidden><label for="api">웹앱 주소 (/exec 로 끝나는 링크)</label><input class="input" id="api" placeholder="https://script.google.com/macros/s/…/exec" inputmode="url"><button class="btn primary" id="apiSave" style="margin-top:8px">저장하고 불러오기</button></div>
    <div class="field"><label for="user">누가 연습하나요?</label><select class="input" id="user"></select></div>
    <div class="field" id="langWrap" hidden><label for="lang">학습 언어</label><select class="input" id="lang"></select></div>
    <div class="field"><label for="sector">섹터</label><select class="input" id="sector"></select></div>
    <div class="field"><label for="q">검색</label><input class="input" id="q" type="search" placeholder="단어 검색"></div>
    <div class="row"><button class="btn" id="reload">단어 새로 불러오기</button></div>
    <p class="muted" id="status" aria-live="polite"></p>
    <div class="list" id="list" aria-label="단어 목록"></div>
  </section>
  <section class="panel stage" id="stage" aria-live="polite"><p class="muted">왼쪽에서 단어를 고르세요.</p></section>
</main>
<script>
/* ===== 공용 모듈: 음성 합성(Voice) + 발음 점검(Pron) — Index/Mic 두 파일에 같은 코드가 들어갑니다 ===== */
const Voice = (function () {
  const synth = window.speechSynthesis || null;
  let voices = [];
  let token = 0;
  let timer = null;
  const listeners = [];

  function load() { try { voices = synth ? (synth.getVoices() || []) : []; } catch (e) { voices = []; } }
  if (synth) {
    load();
    try { synth.addEventListener('voiceschanged', load); } catch (e) { synth.onvoiceschanged = load; }
  }
  function norm(l) { return String(l || '').toLowerCase().replace('_', '-'); }
  function pick(lang) {
    const l = norm(lang), pre = l.split('-')[0];
    return voices.find(v => norm(v.lang) === l) || voices.find(v => norm(v.lang).indexOf(pre) === 0) || null;
  }
  function hasVoice(lang) { if (!voices.length) load(); return !!pick(lang); }
  function supported() { return !!synth && typeof SpeechSynthesisUtterance !== 'undefined'; }
  function emit(state) { listeners.forEach(fn => { try { fn(state); } catch (e) { /* noop */ } }); }
  function onChange(fn) { listeners.push(fn); }

  function stop() {
    token++;
    clearTimeout(timer);
    try { if (synth) synth.cancel(); } catch (e) { /* noop */ }
    state.playing = false; state.id = null;
    emit({ playing: null });
  }

  /** opts: {id, lang, repeat, rate, gap} — 같은 id를 재생 중에 다시 누르면 정지 */
  function speak(text, opts) {
    const o = opts || {};
    if (!supported()) return { ok: false, reason: 'unsupported' };
    const t = String(text || '').trim();
    if (!t) return { ok: false, reason: 'empty' };
    const wasSame = state.id === o.id && state.playing;
    stop();
    if (wasSame) return { ok: true, stopped: true };
    const my = ++token;
    const repeat = Math.max(1, Math.min(5, o.repeat || 1));
    const lang = o.lang || 'ko-KR';
    const voice = pick(lang);
    let n = 0;
    state.id = o.id; state.playing = true;
    emit({ playing: o.id });
    const finish = () => { if (my !== token) return; state.playing = false; state.id = null; emit({ playing: null }); };
    const next = () => {
      if (my !== token) return;
      if (n >= repeat) { finish(); return; }
      n++;
      let u;
      try { u = new SpeechSynthesisUtterance(t); } catch (e) { finish(); return; }
      u.lang = voice ? voice.lang : lang;
      if (voice) u.voice = voice;
      u.rate = o.rate || 0.95;
      u.pitch = 1;
      let advanced = false;
      const adv = () => { if (advanced) return; advanced = true; clearTimeout(guard); if (my !== token) return; timer = setTimeout(next, o.gap || 450); };
      // 일부 안드로이드 기기에서 onend가 오지 않는 문제 대비 안전 타이머
      const guard = setTimeout(adv, Math.max(4000, t.length * 400 / (u.rate || 1)));
      u.onend = adv;
      u.onerror = adv;
      try { synth.speak(u); } catch (e) { adv(); }
    };
    // Chrome: cancel 직후 바로 speak 하면 무시되는 문제 → 짧게 지연
    timer = setTimeout(next, 80);
    return { ok: true, voice: !!voice };
  }
  const state = { id: null, playing: false };
  function info() {
    if (!voices.length) load();
    return { supported: supported(), count: voices.length, ko: hasVoice('ko-KR'), vi: hasVoice('vi-VN'), en: hasVoice('en-US') };
  }
  return { speak, stop, hasVoice, supported, onChange, info, state };
})();

const Pron = (function () {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  const ua = navigator.userAgent || '';
  const isIOS = /iP(hone|ad|od)/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isInApp = /KAKAOTALK|NAVER\(inapp|FBAN|FBAV|Instagram|Line\/|DaumApps/i.test(ua);
  const isSamsung = /SamsungBrowser/i.test(ua);
  const inFrame = (function () { try { return window.top !== window; } catch (e) { return true; } })();

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  function micPolicy() {
    try {
      const p = document.permissionsPolicy || document.featurePolicy;
      if (p && typeof p.allowsFeature === 'function') return p.allowsFeature('microphone') ? 'allowed' : 'blocked';
    } catch (e) { /* noop */ }
    return 'unknown';
  }
  async function permState() {
    try {
      if (navigator.permissions && navigator.permissions.query) {
        const r = await navigator.permissions.query({ name: 'microphone' });
        return r.state;
      }
    } catch (e) { /* noop */ }
    return 'unknown';
  }
  function support() {
    return { sr: !!SR, secure: window.isSecureContext !== false, isIOS: isIOS, isInApp: isInApp, isSamsung: isSamsung, inFrame: inFrame, policy: micPolicy() };
  }

  const INFO = {
    'unsupported': { code: 'E014', title: '이 브라우저는 음성 인식을 지원하지 않아요', tip: isIOS ? 'iPhone/iPad는 Safari에서 설정 → Safari → 고급 → 실험적 기능에서 음성 인식을 켠 뒤 다시 열어주세요.' : 'Chrome(안드로이드·PC)이나 Edge에서 열어주세요. 카카오톡·네이버 앱 안의 브라우저는 지원하지 않는 경우가 많아요.', fallback: true },
    'not-allowed': { code: 'E002', title: '마이크 사용이 허용되지 않았어요', tip: '주소창 왼쪽 자물쇠(또는 사이트 설정)에서 마이크를 "허용"으로 바꾼 뒤 다시 눌러주세요.', fallback: true },
    'service-not-allowed': { code: 'E002', title: '이 환경에서는 음성 인식 서비스가 막혀 있어요', tip: '앱 화면(삽입 프레임)에서는 막히는 경우가 있어요. "발음 점검 전용 페이지"나 새 탭에서 열어 다시 시도해주세요.', fallback: true },
    'no-device': { code: 'E002', title: '마이크를 찾을 수 없어요', tip: '마이크가 연결되어 있는지, 다른 앱이 마이크를 쓰고 있지 않은지 확인해주세요.', fallback: true },
    'audio-capture': { code: 'E002', title: '마이크 소리를 가져오지 못했어요', tip: '다른 앱(통화·녹음)이 마이크를 쓰는 중일 수 있어요. 닫고 다시 시도해주세요.', fallback: true },
    'network': { code: 'E001', title: '음성 인식 서버에 연결하지 못했어요', tip: '인터넷 연결을 확인하고 다시 시도해주세요. (Chrome 음성 인식은 인터넷이 필요해요)', fallback: false },
    'language-not-supported': { code: 'E014', title: '이 기기는 해당 언어 음성 인식을 지원하지 않아요', tip: '기기 설정 → 언어 → 음성 입력에서 해당 언어를 추가해주세요.', fallback: true },
    'no-speech': { code: 'E003', title: '소리가 들리지 않았어요', tip: '마이크 버튼을 누른 뒤 1~2초 안에 또렷하게 말해 보세요.', fallback: false },
    'busy': { code: 'E008', title: '이미 마이크가 켜져 있어요', tip: '잠시 후 다시 눌러주세요.', fallback: false },
    'start-timeout': { code: 'E007', title: '마이크가 시작되지 않았어요', tip: '권한 창이 떠 있다면 "허용"을 눌러주세요. 계속되면 새 탭/전용 페이지에서 시도해주세요.', fallback: true },
    'aborted': { code: 'E010', title: '중단했어요', tip: '', fallback: false },
    'unknown': { code: 'E013', title: '음성 인식 중 알 수 없는 오류가 났어요', tip: '다시 시도하고, 계속되면 진단 패널의 로그를 보내주세요.', fallback: true }
  };
  function info(key, extra) {
    const base = INFO[key] || INFO.unknown;
    const r = Object.assign({ key: key }, base, extra || {});
    if ((key === 'not-allowed' || key === 'service-not-allowed' || key === 'start-timeout') && inFrame && micPolicy() === 'blocked') {
      r.tip = '이 화면은 구글 앱스스크립트 안(삽입 프레임)에서 열려 있어 브라우저가 마이크를 막고 있어요. "발음 점검 전용 페이지"를 열거나, 아래 "직접 평가"로 연습할 수 있어요.';
    }
    return r;
  }

  async function checkMic() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return { ok: true, skipped: true };
    try {
      const st = await navigator.mediaDevices.getUserMedia({ audio: true });
      try { st.getTracks().forEach(t => t.stop()); } catch (e) { /* noop */ }
      return { ok: true };
    } catch (e) {
      return { ok: false, name: e && e.name ? e.name : 'Error', message: e && e.message ? e.message : '' };
    }
  }

  /* ---- 점수 계산 ---- */
  function clean(s) {
    return String(s || '').normalize('NFC').toLowerCase()
      .replace(/[.,!?;:"'“”‘’~()\[\]{}\-·…،。、！？]/g, ' ').replace(/\s+/g, ' ').trim();
  }
  function stripTone(s) { return s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd'); }
  function lev(a, b) {
    const m = a.length, n = b.length;
    if (!m) return n; if (!n) return m;
    let prev = new Array(n + 1), cur = new Array(n + 1);
    for (let j = 0; j <= n; j++) prev[j] = j;
    for (let i = 1; i <= m; i++) {
      cur[0] = i;
      for (let j = 1; j <= n; j++) {
        const c = a.charCodeAt(i - 1) === b.charCodeAt(j - 1) ? 0 : 1;
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + c);
      }
      const t = prev; prev = cur; cur = t;
    }
    return prev[n];
  }
  function sim(a, b) {
    if (!a && !b) return 1;
    if (!a || !b) return 0;
    return 1 - lev(a, b) / Math.max(a.length, b.length);
  }
  function scoreOne(target, heard, lang) {
    const t = clean(target), h = clean(heard);
    if (!t || !h) return 0;
    const l = String(lang || '').toLowerCase();
    if (l.indexOf('vi') === 0) {
      const full = sim(t, h);
      const bare = sim(stripTone(t), stripTone(h));
      return 0.6 * full + 0.4 * bare;
    }
    if (l.indexOf('ko') === 0) return sim(t.replace(/ /g, ''), h.replace(/ /g, ''));
    return sim(t, h);
  }
  function score(target, alts, lang) {
    let best = -1, heard = '';
    (alts || []).forEach(a => { const s = scoreOne(target, a, lang); if (s > best) { best = s; heard = a; } });
    return { score: Math.max(0, Math.round(best * 100)), heard: heard, alts: alts || [] };
  }

  /* ---- 녹음/인식 시작 ----
   * o: {text, lang, onState(s), onDone({score,heard,alts}), onFail(info), timeoutMs}
   * 반환: {stop(), abort()} */
  function start(o) {
    const ctl = { stopped: false, rec: null, stop: function () { try { if (ctl.rec) ctl.rec.stop(); } catch (e) { /* noop */ } }, abort: function () { ctl.stopped = true; try { if (ctl.rec) ctl.rec.abort(); } catch (e) { /* noop */ } } };
    (async function () {
      try { Voice.stop(); } catch (e) { /* noop */ }
      if (!SR) { o.onFail(info('unsupported')); return; }
      o.onState('requesting');
      if (!isIOS) {
        const m = await checkMic();
        if (ctl.stopped) return;
        if (!m.ok) {
          const nm = m.name || '';
          o.onFail(info(nm === 'NotFoundError' || nm === 'OverconstrainedError' ? 'no-device' : (nm === 'NotReadableError' ? 'audio-capture' : 'not-allowed'), { detail: nm + ' ' + m.message }));
          return;
        }
        await sleep(220);
        if (ctl.stopped) return;
      }
      let rec;
      try { rec = new SR(); } catch (e) { o.onFail(info('unsupported', { detail: String(e) })); return; }
      ctl.rec = rec;
      rec.lang = o.lang || 'ko-KR';
      rec.interimResults = true;
      rec.maxAlternatives = 5;
      rec.continuous = false;
      let finalAlts = [], interim = '', err = null, started = false, finished = false, timer = null, startTimer = null;
      const done = function (fn) { if (finished) return; finished = true; clearTimeout(timer); clearTimeout(startTimer); if (!ctl.stopped) fn(); };
      startTimer = setTimeout(function () {
        done(function () { try { rec.abort(); } catch (e) { /* noop */ } o.onFail(info('start-timeout')); });
      }, 8000);
      rec.onstart = function () {
        started = true; clearTimeout(startTimer);
        o.onState('listening');
        timer = setTimeout(function () { try { rec.stop(); } catch (e) { /* noop */ } }, o.timeoutMs || 9000);
      };
      rec.onresult = function (ev) {
        for (let i = ev.resultIndex; i < ev.results.length; i++) {
          const r = ev.results[i];
          if (r.isFinal) { finalAlts = []; for (let k = 0; k < r.length; k++) finalAlts.push(r[k].transcript); }
          else if (r[0]) interim = r[0].transcript;
        }
      };
      rec.onerror = function (ev) { err = (ev && ev.error) || 'unknown'; };
      rec.onend = function () {
        done(function () {
          const alts = finalAlts.length ? finalAlts : (interim ? [interim] : []);
          if (alts.length) { o.onState('processing'); o.onDone(score(o.text, alts, o.lang)); return; }
          if (err && err !== 'no-speech' && err !== 'aborted') { o.onFail(info(err)); return; }
          o.onFail(info(started ? 'no-speech' : 'start-timeout'));
        });
      };
      try { rec.start(); }
      catch (e) { done(function () { o.onFail(info(e && e.name === 'InvalidStateError' ? 'busy' : 'unknown', { detail: String(e) })); }); }
    })();
    return ctl;
  }

  return { start: start, support: support, permState: permState, micPolicy: micPolicy, scoreOne: scoreOne, score: score, info: info, checkMic: checkMic };
})();

</script>
<script>
(function () {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const params = new URLSearchParams(location.search);
function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 무시 */ } }
let API = params.get('api') || lsGet('hby_api');
if (params.get('api')) lsSet('hby_api', API);
const IC_MIC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
const IC_SPK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const IC_STOP = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';

const S = { data: null, user: params.get('u') || lsGet('hby_user') || '아빠', sector: '전체', q: '', cur: null, pron: null, ctl: null };

function visible() {
  const c = S.data.commonOwner;
  return S.data.words.filter(w => !w.owner || w.owner === c || w.owner === S.user);
}
// 모국어·학습 언어: 서버가 내려준 langInfo(프로필 기준, 없으면 기본값). 학습 언어가 여럿이면 선택 상자로 고름.
const TTS = { ko: 'ko-KR', vi: 'vi-VN', en: 'en-US' };
const LNAME = { ko: '한국어', vi: '베트남어', en: '영어' };
function langInfo() {
  const li = S.data && S.data.langInfo && S.data.langInfo[S.user];
  if (li && li.learn && li.learn.length) return li;
  const nv = !!(S.data && S.data.koBaseUsers && S.data.koBaseUsers.indexOf(S.user) !== -1);
  return { native: nv ? 'vi' : 'ko', learn: [nv ? 'ko' : 'vi'] };
}
function tgt() { const li = langInfo(); const v = lsGet('hby_tgt_' + S.user); return li.learn.indexOf(v) !== -1 ? v : li.learn[0]; }
const target = w => {
  const li = langInfo(), t = tgt(), wt = { vi: w.vi, ko: w.ko, en: w.en };
  return { text: wt[t] || w.vi || w.ko || w.en, lang: TTS[t], mean: wt[li.native] || '' };
};
const first = t => String(t || '').split(/[\/,;]/)[0].trim();
const keyOf = w => w.vi + '|' + w.ko;

async function load() {
  $('#status').textContent = '단어를 불러오는 중…';
  if (!API) { $('#apiBox').hidden = false; $('#status').textContent = '웹앱 주소를 먼저 입력해주세요.'; return; }
  try {
    const res = await fetch(API + (API.indexOf('?') === -1 ? '?' : '&') + 'action=words');
    const d = await res.json();
    if (d.status !== 'success') throw new Error(d.message || '불러오기 실패');
    S.data = d;
    $('#apiBox').hidden = true;
    $('#status').textContent = '';
    fill();
  } catch (e) {
    $('#apiBox').hidden = false;
    $('#status').innerHTML = '불러오지 못했어요: ' + esc(e.message) + '<br>웹앱이 "모든 사용자" 액세스로 배포됐는지, 주소가 /exec 인지 확인해주세요.';
  }
}
function fill() {
  const d = S.data;
  if (d.users.indexOf(S.user) === -1) S.user = d.users[0];
  $('#user').innerHTML = d.users.map(u => '<option' + (u === S.user ? ' selected' : '') + '>' + esc(u) + '</option>').join('');
  const secs = {}; visible().forEach(w => { const s = w.sector || '미분류'; secs[s] = (secs[s] || 0) + 1; });
  const li = langInfo();
  $('#langWrap').hidden = li.learn.length < 2;
  $('#lang').innerHTML = li.learn.map(c => '<option value="' + c + '"' + (tgt() === c ? ' selected' : '') + '>' + LNAME[c] + '</option>').join('');
  $('#sector').innerHTML = '<option value="전체">전체 (' + visible().length + ')</option>' + Object.keys(secs).map(s => '<option value="' + esc(s) + '"' + (S.sector === s ? ' selected' : '') + '>' + esc(s) + ' (' + secs[s] + ')</option>').join('');
  renderList();
}
function filtered() {
  let ws = visible();
  if (S.sector !== '전체') ws = ws.filter(w => (w.sector || '미분류') === S.sector);
  const q = S.q.trim().toLowerCase();
  if (q) ws = ws.filter(w => (w.vi + ' ' + w.ko + ' ' + w.en).toLowerCase().indexOf(q) !== -1);
  return ws;
}
function renderList() {
  const ws = filtered().slice(0, 300);
  $('#list').innerHTML = ws.length ? ws.map(w => {
    const t = target(w);
    return '<div class="item" aria-current="' + (S.cur && keyOf(S.cur) === keyOf(w)) + '"><button class="pick" data-k="' + esc(keyOf(w)) + '"><div class="t1">' + esc(first(t.text)) + '</div><div class="t2">' + esc(t.mean) + '</div></button></div>';
  }).join('') : '<p class="muted">단어가 없어요.</p>';
}
function stage() {
  const w = S.cur; if (!w) return;
  const t = target(w), txt = first(t.text), p = S.pron;
  let h = '<div class="target" lang="' + t.lang.slice(0, 2) + '">' + esc(txt) + '</div><p class="muted">' + esc(t.mean) + '</p>';
  h += '<div class="row" style="justify-content:center;margin:12px 0"><button class="btn icon" id="spk" aria-label="듣기">' + IC_SPK + '</button>';
  if (p && (p.status === 'listening' || p.status === 'requesting')) h += '<button class="btn rec pulse" id="stopMic">' + IC_STOP + ' ' + (p.status === 'requesting' ? '마이크 준비 중…' : '듣는 중… 눌러서 끝내기') + '</button>';
  else h += '<button class="btn primary" id="mic">' + IC_MIC + ' 발음 점검</button>';
  h += '</div>';
  if (p && p.status === 'processing') h += '<p><span class="spin"></span> 채점 중…</p>';
  if (p && p.status === 'done') {
    const c = p.score >= 80 ? 'good' : p.score >= 55 ? 'mid' : 'low';
    h += '<div class="big ' + c + '">' + p.score + '</div><p>인식된 말: “' + esc(p.heard) + '”</p><p class="muted">' + (p.saved === true ? '시트에 저장했어요' : p.saved === false ? '시트 저장에 실패했어요: ' + esc(p.saveErr || '') : '저장 중…') + '</p>';
  }
  if (p && p.status === 'error') {
    const i = p.info;
    h += '<div class="err"><p><b>' + esc(i.title) + '</b> <span class="muted">(' + esc(i.code) + ')</span></p><p>' + esc(i.tip) + '</p>' + (i.detail ? '<p class="muted">' + esc(i.detail) + '</p>' : '') + '</div>';
    if (i.fallback) h += '<div class="row" style="justify-content:center;margin-top:10px"><span class="muted">직접 평가:</span><button class="btn" data-self="90">잘했어요</button><button class="btn" data-self="65">보통</button><button class="btn" data-self="35">다시</button></div>';
  }
  $('#stage').innerHTML = h;
  const spk = $('#spk'); if (spk) spk.onclick = () => Voice.speak(txt, { id: 'w', lang: t.lang, repeat: 1, rate: 0.9 });
  const mic = $('#mic'); if (mic) mic.onclick = start;
  const st = $('#stopMic'); if (st) st.onclick = () => { if (S.ctl) S.ctl.stop(); };
  document.querySelectorAll('[data-self]').forEach(b => { b.onclick = () => { S.pron = { status: 'done', score: Number(b.getAttribute('data-self')), heard: '(직접 평가)' }; save(S.cur, S.pron.score); stage(); }; });
}
async function save(w, score) {
  const prev = (w.scoresByUser[S.user] || []).filter(x => x !== '' && x !== null);
  const scores = [score].concat(prev).slice(0, 3);
  w.scoresByUser[S.user] = scores;
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ type: 'pronounce_history', user: S.user, row: w.row, key: keyOf(w), scores: scores }) });
    const o = await r.json();
    if (o.status !== 'success') throw new Error(o.message || '저장 실패');
    if (S.pron) S.pron.saved = true;
  } catch (e) { if (S.pron) { S.pron.saved = false; S.pron.saveErr = e.message; } }
  stage();
}
function start() {
  const w = S.cur; if (!w) return;
  const t = target(w), txt = first(t.text);
  if (S.ctl) { try { S.ctl.abort(); } catch (e) { /* 무시 */ } }
  S.pron = { status: 'requesting' }; stage();
  S.ctl = Pron.start({
    text: txt, lang: t.lang, timeoutMs: 8000,
    onState: s => { if (S.pron) { S.pron.status = s; stage(); } },
    onDone: r => { S.pron = { status: 'done', score: r.score, heard: r.heard }; stage(); save(w, r.score); },
    onFail: i => { S.pron = { status: 'error', info: i }; stage(); }
  });
}
$('#list').addEventListener('click', ev => {
  const b = ev.target.closest('.pick'); if (!b) return;
  const k = b.getAttribute('data-k');
  S.cur = S.data.words.find(w => keyOf(w) === k) || null; S.pron = null;
  if (S.ctl) { try { S.ctl.abort(); } catch (e) { /* 무시 */ } }
  renderList(); stage();
});
$('#user').addEventListener('change', e => { S.user = e.target.value; lsSet('hby_user', S.user); S.cur = null; S.pron = null; S.sector = '전체'; fill(); $('#stage').innerHTML = '<p class="muted">왼쪽에서 단어를 고르세요.</p>'; });
$('#lang').addEventListener('change', e => { lsSet('hby_tgt_' + S.user, e.target.value); S.cur = null; S.pron = null; renderList(); $('#stage').innerHTML = '<p class="muted">왼쪽에서 단어를 고르세요.</p>'; });
$('#sector').addEventListener('change', e => { S.sector = e.target.value; renderList(); });
$('#q').addEventListener('input', e => { S.q = e.target.value; renderList(); });
$('#reload').addEventListener('click', load);
$('#apiSave').addEventListener('click', () => { API = $('#api').value.trim(); lsSet('hby_api', API); load(); });
load();
})();
</script>
</body>
</html>
