<body>
<header><h1>한베영 단어장 · 발음 점검</h1><small>마이크가 막히는 환경을 위한 전용 페이지예요</small><div id="focusBar" hidden style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="fbAll">다른 단어 고르기</button><button class="btn" id="fbClose">이 창 닫기</button></div></header>
<main>
  <section class="panel" id="left">
    <h2>설정</h2>
    <div class="field" id="apiBox" hidden><label for="api">웹앱 주소 (/exec 로 끝나는 링크)</label><input class="input" id="api" placeholder="https://script.google.com/macros/s/…/exec" inputmode="url"><label for="tok" style="margin-top:8px;display:block">접근 토큰 (스크립트 속성 MIC_TOKEN 값 — 한 번만 입력하면 기억해요)</label><input class="input" id="tok" type="password" autocomplete="off" placeholder="접근 토큰"><button class="btn primary" id="apiSave" style="margin-top:8px">저장하고 불러오기</button></div>

    <div class="field" id="styleWrap" hidden><label for="style">예문 문체</label><select class="input" id="style"><option value="all">구어체 + 문어체</option><option value="spoken">구어체(말할 때)</option><option value="written">문어체(글·격식)</option></select></div>
    <div class="field" id="langWrap" hidden><label for="lang">학습 언어</label><select class="input" id="lang"></select></div>
    <div class="field"><label for="sector">섹터</label><select class="input" id="sector"></select></div>

      <div class="row" style="margin-top:8px"><button class="btn" id="dgCopy">로그 복사</button><button class="btn" id="dgDl">TXT 다운로드</button><button class="btn" id="dgClr">로그 지우기</button></div>
      <pre class="muted" id="dgOut" style="white-space:pre-wrap;word-break:break-all;max-height:200px;overflow:auto"></pre>

</main>
<script>
/* ===== 공용 모듈: 음성 합성(Voice) + 발음 점검(Pron) — Index/Mic 두 파일에 같은 코드가 들어갑니다 ===== */
const Voice = (function () {
  const synth = window.speechSynthesis || null;
  let voices = [];
  let token = 0;
  let timer = null;
  let wantGender = '';            // 'male' | 'female' | '' (프로필 성별에 따라 앱이 지정)
  const listeners = [];
  const state = { id: null, playing: false, cancelCb: null };

  function load() { try { voices = synth ? (synth.getVoices() || []) : []; } catch (e) { voices = []; } }
  if (synth) {
    load();
    try { synth.addEventListener('voiceschanged', load); } catch (e) { synth.onvoiceschanged = load; }
  }
  function norm(l) { return String(l || '').toLowerCase().replace('_', '-'); }
  function l2of(l) { return norm(l).split('-')[0]; }
  function prefGet(l2) { try { return localStorage.getItem('hby_voice_' + l2) || ''; } catch (e) { return ''; } }
  function prefSet(l2, name) { try { if (name) localStorage.setItem('hby_voice_' + l2, name); else localStorage.removeItem('hby_voice_' + l2); } catch (e) { /* noop */ } }

  /* ---- 목소리 성별 추정 (Web Speech API는 성별을 알려주지 않아 이름으로 추정) ---- */
  const FEMALE_RE = /\bfemale\b|\bwoman\b|\bzira\b|\baria\b|\bjenny\b|\bmichelle\b|\bana\b|\bemma\b|\bava\b|\bsamantha\b|\bvictoria\b|\ballison\b|\bsusan\b|\bnicky\b|\bzoe\b|\bjoelle\b|\bkate\b|\bkaren\b|\byuna\b|\bsunhi\b|\bheami\b|\bjimin\b|\bseohyeon\b|\bsoonbok\b|\byujin\b|\bhoaimy\b|\blinh\b|google (us english|한국어|korean|tiếng việt|vietnamese)/i;
  const MALE_RE = /\bmale\b|\bman\b|\bdavid\b|\bmark\b|\bguy\b|\bchristopher\b|\beric\b|\broger\b|\bsteffan\b|\bbrian\b|\bandrew\b|\balex\b|\bfred\b|\btom\b|\baaron\b|\bevan\b|\bnathan\b|\binjoon\b|\bbongjin\b|\bgookmin\b|\bhyunsu\b|\bnamminh\b/i;
  function genderOf(v) {
    const g0 = String((v && v.gender) || '').toLowerCase();   // 브라우저가 gender를 알려주면 그 값을 우선 사용
    if (g0 === 'male' || g0 === 'female') return g0;
    const n = String((v && v.name) || '');
    if (FEMALE_RE.test(n)) return 'female';
    if (MALE_RE.test(n)) return 'male';
    return '';
  }
  /* ---- 음질 점수: 자연스러운(Neural/Natural/Online/Google 등) 음성을 우선, 로봇 음성은 뒤로 ---- */
  function qualityOf(v) {
    const n = String((v && v.name) || '');
    let q = 0;
    if (/natural|neural|online|premium|enhanced|siri|studio|wavenet/i.test(n)) q += 40;
    if (/google/i.test(n)) q += 25;
    if (/compact|espeak|novelty|eloquence/i.test(n)) q -= 60;
    if (!v.localService) q += 5;
    if (v.default) q += 1;
    return q;
  }
  function candidates(lang) {
    const l = norm(lang), pre = l2of(lang);
    const exact = voices.filter(v => norm(v.lang) === l);
    if (pre === 'en') return exact;            // 영어는 미국식(en-US)만 후보 — 영국·인도식 자동 선택 방지
    if (exact.length) return exact;
    return voices.filter(v => norm(v.lang).indexOf(pre) === 0);
  }
  /** 사용자가 직접 고른 음성 → 없으면 (성별 일치 + 음질) 최고점 음성 */
  function pick(lang) {
    if (!voices.length) load();
    const l2 = l2of(lang);
    const saved = prefGet(l2);
    if (saved) {
      const s = voices.find(v => v.name === saved && l2of(v.lang) === l2);
      if (s) return { voice: s, gender: genderOf(s), manual: true };
    }
    const cand = candidates(lang);
    if (!cand.length) return { voice: null, gender: '', manual: false };
    let best = null, bs = -1e9;
    cand.forEach(v => {
      let s = qualityOf(v);
      const g = genderOf(v);
      if (wantGender) { if (g === wantGender) s += 100; else if (g) s -= 100; }
      if (s > bs) { bs = s; best = v; }
    });
    return { voice: best, gender: genderOf(best), manual: false };
  }
  /** 원하는 성별의 음성을 못 찾았을 때만 음높이로 보정 (직접 고른 음성은 그대로) */
  function pitchFor(sel) {
    if (!wantGender || sel.manual) return 1;
    if (sel.gender === wantGender) return 1;
    if (wantGender === 'male') return sel.gender === 'female' ? 0.78 : 0.88;
    return sel.gender === 'male' ? 1.2 : 1.05;
  }
  /** 읽기 전 문장 다듬기: 끊어 읽기·억양이 자연스럽도록 기호 정리, 문장은 마침표로 끝맺음 */
  function prep(t, kind) {
    let s = String(t || '').replace(/\s+/g, ' ').trim();
    s = s.replace(/[~〜]/g, '').replace(/…+/g, ', ').replace(/\s*[\/·]\s*/g, ', ').replace(/[\[\]{}()（）]/g, ' ').replace(/\s+/g, ' ').trim();
    if (kind === 'sentence' && s && !/[.!?。！？]$/.test(s)) s += '.';
    return s;
  }

  function hasVoice(lang) { return !!pick(lang).voice; }
  function supported() { return !!synth && typeof SpeechSynthesisUtterance !== 'undefined'; }
  function emit(st) { listeners.forEach(fn => { try { fn(st); } catch (e) { /* noop */ } }); }
  function onChange(fn) { listeners.push(fn); }

  function stop() {
    token++;
    clearTimeout(timer);
    try { if (synth) synth.cancel(); } catch (e) { /* noop */ }
    state.playing = false; state.id = null;
    const cb = state.cancelCb; state.cancelCb = null;
    emit({ playing: null });
    if (cb) { try { cb(); } catch (e) { /* noop */ } }
  }

  /** opts: {id, lang, repeat, rate, gap, kind:'word'|'sentence', onEnd(status:'done'|'cancel'|'error')}
   *  같은 id를 재생 중에 다시 누르면 정지(토글). */
  function speak(text, opts) {
    const o = opts || {};
    if (!supported()) return { ok: false, reason: 'unsupported' };
    const lang = o.lang || 'ko-KR';
    const l2 = l2of(lang);
    const t = prep(text, o.kind);
    if (!t) return { ok: false, reason: 'empty' };
    const wasSame = o.id !== undefined && state.id === o.id && state.playing;
    stop();
    if (wasSame) return { ok: true, stopped: true };
    try { synth.resume(); } catch (e) { /* noop */ }
    const my = ++token;
    const repeat = Math.max(1, Math.min(5, o.repeat || 1));
    const sel = pick(lang);
    const voice = sel.voice;

const S = { data: null, user: params.get('u') || lsGet('hby_user') || '아빠', sector: '전체', q: '', cur: null, pron: null, ctl: null,
  mode: ['word', 'example', 'both'].indexOf(lsGet('hby_micmode')) !== -1 ? lsGet('hby_micmode') : 'both',
  style: ['all', 'spoken', 'written'].indexOf(lsGet('hby_micstyle')) !== -1 ? lsGet('hby_micstyle') : 'all', item: 'word' };
if (FOCUS) { S.mode = 'both'; S.style = 'all'; S.item = FOCUS.item; }

function visible() {
  const c = S.data.commonOwner;
  return S.data.words.filter(w => !w.owner || w.owner === c || w.owner === S.user);
}
// 모국어·학습 언어: 서버가 내려준 langInfo(프로필 기준, 없으면 기본값). 학습 언어가 여럿이면 선택 상자로 고름.
const TTS = { ko: 'ko-KR', vi: 'vi-VN', en: 'en-US' };
const LNAME = { ko: '한국어', vi: '베트남어', en: '영어' };
function langInfo() {
  const li = S.data && S.data.langInfo && S.data.langInfo[S.user];
  if (li && li.learn && li.learn.length) return li;
  const nv = !!(S.data && S.data.koBaseUsers && S.data.koBaseUsers.indexOf(S.user) !== -1);
  return { native: nv ? 'vi' : 'ko', learn: [nv ? 'ko' : 'vi'] };
}
function tgt() { const li = langInfo(); const v = lsGet('hby_tgt_' + S.user); return li.learn.indexOf(v) !== -1 ? v : li.learn[0]; }
const target = w => {
  const li = langInfo(), t = tgt(), wt = { vi: w.vi, ko: w.ko, en: w.en };
  return { text: wt[t] || w.vi || w.ko || w.en, lang: TTS[t], mean: wt[li.native] || '' };
};
const first = t => String(t || '').split(/[\/,;]/)[0].trim();
const keyOf = w => w.vi + '|' + w.ko;
const SLOT_NAME = { spoken: '구어체', written: '문어체' };
function exOf(w, slot) {
  const e = w.ex && w.ex[slot]; if (!e) return null;
  const li = langInfo(), t = tgt();
  const text = String(e[t] || '').trim();
  return text ? { text: text, mean: String(e[li.native] || '').trim() } : null;
}
function slotsWanted() { return S.style === 'all' ? ['spoken', 'written'] : [S.style]; }
// 현재 단어에서 연습할 수 있는 항목들(단어 / 예문들)
function itemsOf(w) {
  const out = [], t = target(w);
  if (S.mode !== 'example') out.push({ id: 'word', kind: 'word', label: '단어', text: t.text, lang: t.lang, mean: t.mean });
  if (S.mode !== 'word') slotsWanted().forEach(sl => { const x = exOf(w, sl); if (x) out.push({ id: sl, kind: 'ex', label: SLOT_NAME[sl] + ' 예문', text: x.text, lang: t.lang, mean: x.mean }); });
  return out;
}
function curItem(w) {
  const its = itemsOf(w);
  return its.find(x => x.id === S.item) || its[0] || null;
}

async function load() {
  $('#status').textContent = '단어를 불러오는 중…';
  if (!API) { $('#apiBox').hidden = false; $('#status').textContent = '웹앱 주소를 먼저 입력해주세요.'; return; }
  try {
    const t0 = Date.now();
    const res = await fetch(API + (API.indexOf('?') === -1 ? '?' : '&') + 'action=words' + (TOKEN ? '&t=' + encodeURIComponent(TOKEN) : ''));
    const d = await res.json();
    if (d && d.version) SERVER_VER = String(d.version);
    trace('words', Date.now() - t0, d.status === 'success' ? 'ok' : '오류 ' + (d.code || ''), d.runId);
    if (d.status !== 'success') { dlog(d.code || 'E005', 'load', d.message || '불러오기 실패', d.runId); throw new Error(d.message || '불러오기 실패'); }
    S.data = d;
    $('#apiBox').hidden = true;
    $('#status').textContent = '';
    fill();
    applyFocus();
  } catch (e) {
    $('#apiBox').hidden = false;
    const m = String(e && e.message || e);
    let tip;
    if (/Failed to fetch|NetworkError|Load failed/i.test(m)) tip = '서버에 연결하지 못했어요. ① 웹앱 배포의 "액세스 권한"이 <b>모든 사용자(익명)</b>인지(새 버전으로 다시 배포해야 반영돼요) ② 주소가 <b>/exec</b>로 끝나는지 확인해주세요. 앱의 [발음 점검 전용 페이지] 버튼으로 다시 열면 주소가 자동으로 채워져요.';
    else if (/토큰/.test(m)) tip = '접근 토큰이 맞지 않아요. 앱의 [발음 점검 전용 페이지] 버튼으로 다시 열어주세요.';
    else tip = '웹앱 주소가 /exec 인지, 배포가 최신 버전인지 확인해주세요.';
    dlog('E001', 'load', m);
    $('#status').innerHTML = '불러오지 못했어요: ' + esc(m) + '<br>' + tip;
  }
}
let focusDone = false;
function applyFocus() {
  if (!FOCUS || focusDone) return; focusDone = true;
  const w = visible().find(x => keyOf(x) === FOCUS.key);
  if (!w) { $('#status').textContent = '선택한 단어를 찾지 못해 전체 목록을 보여드려요.'; return; }
  S.cur = w; document.body.classList.add('focus'); $('#focusBar').hidden = false;
  renderList(); stage();
  if (FOCUS.go) { try { start(); } catch (e) { dlog('E013', 'autoStart', e && e.message); } }
}
function fill() {
  const d = S.data;
  if (d.users.indexOf(S.user) === -1) S.user = d.users[0];
  $('#user').innerHTML = d.users.map(u => '<option' + (u === S.user ? ' selected' : '') + '>' + esc(u) + '</option>').join('');
  const secs = {}; visible().forEach(w => { const s = w.sector || '미분류'; secs[s] = (secs[s] || 0) + 1; });
  const li = langInfo();
  $('#mode').value = S.mode; $('#style').value = S.style; $('#styleWrap').hidden = S.mode === 'word';
  $('#langWrap').hidden = li.learn.length < 2;
  $('#lang').innerHTML = li.learn.map(c => '<option value="' + c + '"' + (tgt() === c ? ' selected' : '') + '>' + LNAME[c] + '</option>').join('');
  $('#sector').innerHTML = '<option value="전체">전체 (' + visible().length + ')</option>' + Object.keys(secs).map(s => '<option value="' + esc(s) + '"' + (S.sector === s ? ' selected' : '') + '>' + esc(s) + ' (' + secs[s] + ')</option>').join('');
  renderList();
}
function filtered() {
  let ws = visible();
  if (S.sector !== '전체') ws = ws.filter(w => (w.sector || '미분류') === S.sector);
  const q = S.q.trim().toLowerCase();
  if (q) ws = ws.filter(w => (w.vi + ' ' + w.ko + ' ' + w.en).toLowerCase().indexOf(q) !== -1);
  if (S.mode === 'example') ws = ws.filter(w => itemsOf(w).length);
  return ws;
}
function renderList() {
  const ws = filtered().slice(0, 300);
  $('#list').innerHTML = ws.length ? ws.map(w => {
    const t = target(w);
    return '<div class="item" aria-current="' + (!!S.cur && keyOf(S.cur) === keyOf(w)) + '"><button class="pick" data-k="' + esc(keyOf(w)) + '"><div class="t1">' + esc(first(t.text)) + '</div><div class="t2">' + esc(S.mode === 'example' ? ((itemsOf(w)[0] || {}).text || '') : t.mean) + '</div></button></div>';
  }).join('') : '<p class="muted">단어가 없어요.</p>';
}
function stage() {
  const w = S.cur; if (!w) return;
  const its = itemsOf(w), t = curItem(w), p = S.pron;
  if (!t) { $('#stage').innerHTML = '<p class="muted">이 단어는 선택한 문체의 예문이 아직 없어요. 연습 대상을 바꿔보세요.</p>'; return; }
  const txt = t.kind === 'word' ? first(t.text) : t.text;
  let h = '';
  if (its.length > 1) h += '<div class="row" style="justify-content:center;margin-bottom:10px" role="group" aria-label="연습 항목">' + its.map(x => '<button class="btn' + (x.id === t.id ? ' primary' : '') + '" data-item="' + x.id + '" aria-pressed="' + (x.id === t.id) + '">' + esc(x.label) + '</button>').join('') + '</div>';
  else h += '<p class="muted" style="margin:0 0 6px">' + esc(t.label) + '</p>';
  h += '<div class="target' + (t.kind === 'ex' ? ' sm' : '') + '" lang="' + t.lang.slice(0, 2) + '">' + esc(txt) + '</div><p class="muted">' + esc(t.mean) + '</p>';
  h += '<div class="row" style="justify-content:center;margin:12px 0"><button class="btn icon" id="spk" aria-label="듣기">' + IC_SPK + '</button>';
  if (p && (p.status === 'listening' || p.status === 'requesting')) h += '<button class="btn rec pulse" id="stopMic">' + IC_STOP + ' ' + (p.status === 'requesting' ? '마이크 준비 중…' : '듣는 중… 눌러서 끝내기') + '</button>';
  else h += '<button class="btn primary" id="mic">' + IC_MIC + ' 발음 점검</button>';
  h += '</div>';
  if (p && p.status === 'processing') h += '<p><span class="spin"></span> 채점 중…</p>';
  if (p && p.status === 'done') {
    const c = p.score >= 80 ? 'good' : p.score >= 55 ? 'mid' : 'low';
    const sv = t.kind !== 'word' ? '예문 점수는 시트에 저장하지 않아요' : (p.saved === true ? '시트에 저장했어요' : p.saved === false ? '시트 저장에 실패했어요: ' + esc(p.saveErr || '') : '저장 중…');
    h += '<div class="big ' + c + '">' + p.score + '</div><p>인식된 말: “' + esc(p.heard) + '”</p><p class="muted">' + sv + '</p>';
  }
  if (p && p.status === 'error') {
    const i = p.info;
    h += '<div class="err"><p><b>' + esc(i.title) + '</b> <span class="muted">(' + esc(i.code) + ')</span></p><p>' + esc(i.tip) + '</p>' + (i.detail ? '<p class="muted">' + esc(i.detail) + '</p>' : '') + '</div>';
    if (i.fallback) h += '<div class="row" style="justify-content:center;margin-top:10px"><span class="muted">직접 평가:</span><button class="btn" data-self="90">잘했어요</button><button class="btn" data-self="65">보통</button><button class="btn" data-self="35">다시</button></div>';
  }
  $('#stage').innerHTML = h;
  const spk = $('#spk'); if (spk) spk.onclick = () => Voice.speak(txt, { id: 'w', lang: t.lang, repeat: 1, rate: (t.lang.indexOf('vi') === 0 ? 0.6 : (t.lang.indexOf('ko') === 0 ? 0.8 : 0.7)), kind: t.kind === 'ex' ? 'sentence' : 'word' });
  const mic = $('#mic'); if (mic) mic.onclick = start;
  const st = $('#stopMic'); if (st) st.onclick = () => { if (S.ctl) S.ctl.stop(); };
  document.querySelectorAll('[data-item]').forEach(b => { b.onclick = () => { if (S.ctl) { try { S.ctl.abort(); } catch (e) { /* 무시 */ } } S.item = b.getAttribute('data-item'); S.pron = null; stage(); }; });
  document.querySelectorAll('[data-self]').forEach(b => { b.onclick = () => { S.pron = { status: 'done', score: Number(b.getAttribute('data-self')), heard: '(직접 평가)' }; if (t.kind === 'word') save(S.cur, S.pron.score); stage(); }; });
}
async function save(w, score) {
  const prev = (w.scoresByUser[S.user] || []).filter(x => x !== '' && x !== null);
  const scores = [score].concat(prev).slice(0, 3);
  w.scoresByUser[S.user] = scores;
  try {
    const t0 = Date.now();
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ type: 'pronounce_history', user: S.user, row: w.row, key: keyOf(w), scores: scores, t: TOKEN || undefined }) });
    const o = await r.json();
    trace('pronounce_history', Date.now() - t0, o.status === 'success' ? 'ok' : '오류 ' + (o.code || ''), o.runId);
    if (o.status !== 'success') { dlog(o.code || 'E005', 'save', o.message || '저장 실패', o.runId); throw new Error(o.message || '저장 실패'); }
    if (S.pron) S.pron.saved = true;
  } catch (e) { dlog('E005', 'save', e && e.message); if (S.pron) { S.pron.saved = false; S.pron.saveErr = e.message; } }
  stage();
}
function start() {
  const w = S.cur; if (!w) return;
  const t = curItem(w); if (!t) return;
  const txt = t.kind === 'word' ? first(t.text) : t.text;
  if (S.ctl) { try { S.ctl.abort(); } catch (e) { /* 무시 */ } }
  S.pron = { status: 'requesting' }; stage();
  S.ctl = Pron.start({
    text: txt, lang: t.lang, timeoutMs: t.kind === 'ex' ? 14000 : 8000,
    onState: s => { if (S.pron) { S.pron.status = s; stage(); } },
    onDone: r => { S.pron = { status: 'done', score: r.score, heard: r.heard }; stage(); if (t.kind === 'word') save(w, r.score); },
    onFail: i => { S.pron = { status: 'error', info: i }; stage(); }
  });
}
$('#list').addEventListener('click', ev => {
  const b = ev.target.closest('.pick'); if (!b) return;
  const k = b.getAttribute('data-k');
  S.cur = visible().find(w => keyOf(w) === k) || null; S.pron = null; S.item = S.mode === 'example' ? '' : 'word';
  if (S.ctl) { try { S.ctl.abort(); } catch (e) { /* 무시 */ } }
  renderList(); stage();
});
$('#user').addEventListener('change', e => { S.user = e.target.value; lsSet('hby_user', S.user); S.cur = null; S.pron = null; S.sector = '전체'; fill(); $('#stage').innerHTML = '<p class="muted">왼쪽에서 단어를 고르세요.</p>'; });
$('#lang').addEventListener('change', e => { lsSet('hby_tgt_' + S.user, e.target.value); S.cur = null; S.pron = null; renderList(); $('#stage').innerHTML = '<p class="muted">왼쪽에서 단어를 고르세요.</p>'; });
$('#mode').addEventListener('change', e => { S.mode = e.target.value; lsSet('hby_micmode', S.mode); S.item = S.mode === 'example' ? '' : 'word'; S.pron = null; $('#styleWrap').hidden = S.mode === 'word'; renderList(); if (S.cur) stage(); });
$('#style').addEventListener('change', e => { S.style = e.target.value; lsSet('hby_micstyle', S.style); S.item = S.mode === 'example' ? '' : 'word'; S.pron = null; renderList(); if (S.cur) stage(); });
$('#sector').addEventListener('change', e => { S.sector = e.target.value; renderList(); });
$('#q').addEventListener('input', e => { S.q = e.target.value; renderList(); });
$('#reload').addEventListener('click', load);
$('#dgOut').textContent = dtext();
$('#dgCopy').addEventListener('click', async () => {
  const t = dtext();
  try { await navigator.clipboard.writeText(t); $('#status').textContent = '로그를 복사했어요. 채팅창에 붙여넣어 주세요.'; }
  catch (e) { const r = document.createRange(); r.selectNodeContents($('#dgOut')); const g = getSelection(); g.removeAllRanges(); g.addRange(r); $('#status').textContent = '자동 복사가 막혔어요. 선택된 내용을 길게 눌러 복사해주세요.'; }
});
$('#dgDl').addEventListener('click', () => {
  try {
    const d = new Date(), z = n => String(n).padStart(2, '0');
    const name = 'Diag(' + d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()) + ',' + z(d.getHours()) + z(d.getMinutes()) + ',Voca).txt';
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([dtext()], { type: 'text/plain;charset=utf-8' })); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  } catch (e) { $('#status').textContent = '다운로드가 막혔어요. [로그 복사]를 이용해주세요.'; }
});
$('#dgClr').addEventListener('click', () => { DLOG.length = 0; $('#dgN').textContent = ''; $('#dgOut').textContent = dtext(); });
$('#apiSave').addEventListener('click', () => { API = $('#api').value.trim() || API; const tk = $('#tok').value.trim(); if (tk) { TOKEN = tk; lsSet('hby_mk', TOKEN); } lsSet('hby_api', API); load(); });
$('#api').value = API || '';
$('#fbAll').addEventListener('click', () => { document.body.classList.remove('focus'); $('#focusBar').hidden = true; });
$('#fbClose').addEventListener('click', () => { try { window.close(); } catch (e) { /* noop */ } $('#status').textContent = '창이 닫히지 않으면 브라우저에서 이 탭을 직접 닫아주세요.'; });
load();
})();
</script>
