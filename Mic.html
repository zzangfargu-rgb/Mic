<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14233a">
<title>한베영 단어장 · 발음 점검</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8eef0;--surface:#fff;--surface2:#f1f6f7;--ink:#14233a;--ink2:#4a596e;--line:#cdd8dc;--lotus:#c2306a;--lotus-ink:#fff;--jade:#17766a;--gold:#9a6a06;--bad:#b3261e;--ok:#17766a;--serif:'Noto Serif KR','Be Vietnam Pro',serif;--sans:'Be Vietnam Pro','Noto Sans KR',system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0d192d;--surface:#152540;--surface2:#1b2d4c;--ink:#e8eef7;--ink2:#a8b7ce;--line:#2a3e5f;--lotus:#f27aa5;--lotus-ink:#0d192d;--jade:#56c9b6;--gold:#e6bb55;--bad:#ff8a80;--ok:#56c9b6;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--sans);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--jade);outline-offset:2px}
[hidden]{display:none!important}
header{background:var(--ink);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
header h1{margin:0;font:700 21px var(--serif)}
header small{opacity:.8}
main{max-width:980px;margin:0 auto;padding:14px 14px calc(30px + env(safe-area-inset-bottom));display:grid;gap:14px}
body.focus #left{display:none}body.focus main{grid-template-columns:1fr!important}
#focusBar[hidden]{display:none!important}
@media (min-width:900px){main{grid-template-columns:360px minmax(0,1fr);align-items:start;padding-top:24px}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.panel h2{margin:0 0 10px;font:700 17px var(--serif)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:13.5px;font-weight:600;color:var(--ink2)}
.input{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:8px 12px}
.btn{min-height:48px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.btn.primary{background:var(--lotus);color:var(--lotus-ink);border-color:transparent}
.btn.rec{background:var(--bad);color:#fff;border-color:transparent}
.btn.icon{width:48px;padding:0}
.btn svg{width:22px;height:22px}
.btn[disabled]{opacity:.5}
.btn.playing{background:var(--jade);color:#fff;border-color:transparent}
.muted{color:var(--ink2);font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.list{display:grid;gap:8px;max-height:56vh;overflow:auto}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.item[aria-current="true"]{border-color:var(--lotus);box-shadow:0 0 0 2px color-mix(in srgb,var(--lotus) 30%,transparent)}

.stage{text-align:center;padding:22px 14px}
.target{font:700 clamp(36px,9vw,64px)/1.1 var(--serif);overflow-wrap:anywhere}
.target.sm{font-size:clamp(22px,5vw,34px);line-height:1.3}
.big{font:700 64px/1 var(--serif);margin:10px 0}
.big small{font-size:22px;margin-left:4px;font-weight:600}
.good{color:var(--ok)}.mid{color:var(--gold)}.low{color:var(--bad)}
.err{text-align:left;background:var(--surface2);border-radius:14px;padding:12px;margin-top:12px}
.err b{color:var(--bad)}
.spin{width:18px;height:18px;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;animation:r .7s linear infinite;display:inline-block}
@keyframes r{to{transform:rotate(360deg)}}
.pulse{animation:p 1.2s ease-in-out infinite}
@keyframes p{50%{box-shadow:0 0 0 10px rgba(179,38,30,.2)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* ---- 3개 언어 단어 카드 ---- */
.wtri{display:grid;gap:8px;margin:6px 0 4px;text-align:left}
.wrow{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface2)}
.wrow .lg{flex:none;min-width:3.8em;font-size:12.5px;font-weight:700;color:var(--ink2)}

.wrow.on{border:2px solid var(--lotus);background:color-mix(in srgb,var(--lotus) 8%,var(--surface))}
.wrow.on .tx{font-size:clamp(32px,9vw,56px);line-height:1.1}
.wrow .tg{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--lotus)}
/* ---- 이전/다음 ---- */
.navbar{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom));z-index:5;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:18px;padding:8px;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:0 4px 14px rgba(20,35,58,.14)}
.navbar .btn{min-height:52px}
/* ---- 결과·채점 기준 ---- */
.rectog{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 8px;font-size:14px;color:var(--ink2)}
.rectog input{width:18px;height:18px;accent-color:var(--lotus)}
.res{margin-top:6px}
.cmp{display:grid;gap:6px;text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:10px 0 6px}
.cmp>div{display:flex;gap:10px;align-items:baseline}
.cmp .k{flex:none;width:2.6em;font-size:12.5px;font-weight:700;color:var(--ink2)}
.cmp .v{font:600 18px/1.4 var(--serif);overflow-wrap:anywhere}
.x{color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,transparent);border-radius:3px;text-decoration:underline}
.why{margin:6px 0 0;font-size:14.5px;text-align:left}
details.crit{margin-top:14px;text-align:left;border:1px solid var(--line);border-radius:14px;background:var(--surface2)}
details.crit summary{cursor:pointer;padding:12px 14px;font-weight:700;min-height:44px}
details.crit .cb{padding:0 14px 12px;font-size:14.5px}
details.crit ul{margin:6px 0;padding-left:20px}
table.gtab{border-collapse:collapse;margin:6px 0}
.gtab td{border:1px solid var(--line);padding:4px 12px;font-size:14px}
.gtab td:first-child{font-weight:700}
</style>
</head>
<body>
<header><h1>한베영 단어장 · 발음 점검</h1><small>마이크가 막히는 환경을 위한 전용 페이지예요</small><div id="focusBar" hidden style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="fbAll">다른 단어 고르기</button><button class="btn" id="fbClose">이 창 닫기</button></div></header>
<main>
  <section class="panel" id="left">
    <h2>설정</h2>
    <div class="field" id="apiBox" hidden><label for="api">웹앱 주소 (/exec 로 끝나는 링크)</label><input class="input" id="api" placeholder="https://script.google.com/macros/s/…/exec" inputmode="url"><label for="tok" style="margin-top:8px;display:block">접근 토큰 (스크립트 속성 MIC_TOKEN 값 — 한 번만 입력하면 기억해요)</label><input class="input" id="tok" type="password" autocomplete="off" placeholder="접근 토큰"><button class="btn primary" id="apiSave" style="margin-top:8px">저장하고 불러오기</button></div>
    <div class="field"><label for="user">누가 연습하나요?</label><select class="input" id="user"></select></div>
    <div class="field"><label for="mode">연습 대상</label><select class="input" id="mode"><option value="word">단어만</option><option value="example">예문만</option><option value="both">단어 + 예문</option></select></div>
    <div class="field" id="styleWrap" hidden><label for="style">예문 문체</label><select class="input" id="style"><option value="all">구어체 + 문어체</option><option value="spoken">구어체(말할 때)</option><option value="written">문어체(글·격식)</option></select></div>
    <div class="field" id="langWrap" hidden><label for="lang">학습 언어</label><select class="input" id="lang"></select></div>
    <div class="field"><label for="sector">섹터</label><select class="input" id="sector"></select></div>
    <div class="field"><label for="q">검색</label><input class="input" id="q" type="search" placeholder="단어 검색"></div>
    <div class="row"><button class="btn" id="reload">단어 새로 불러오기</button></div>
    <p class="muted" id="status" aria-live="polite"></p>
    <details id="dg"><summary>🛠 진단 <span id="dgN"></span></summary>
      <div class="row" style="margin-top:8px"><button class="btn" id="dgCopy">로그 복사</button><button class="btn" id="dgDl">TXT 다운로드</button><button class="btn" id="dgClr">로그 지우기</button></div>
      <pre class="muted" id="dgOut" style="white-space:pre-wrap;word-break:break-all;max-height:200px;overflow:auto"></pre>
    </details>
    <div class="list" id="list" aria-label="단어 목록"></div>
  </section>
  <section class="panel stage" id="stage" aria-live="polite"><p class="muted">왼쪽에서 단어를 고르세요.</p></section>
</main>
<script>
/* ===== 공용 모듈: 음성 합성(Voice) + 발음 점검(Pron) — Index/Mic 두 파일에 같은 코드가 들어갑니다 ===== */
const Voice = (function () {
  const synth = window.speechSynthesis || null;
  let voices = [];
  let token = 0;
  let timer = null;
  let wantGender = '';            // 'male' | 'female' | '' (프로필 성별에 따라 앱이 지정)
  const listeners = [];
  const state = { id: null, playing: false, cancelCb: null };

  function load() { try { voices = synth ? (synth.getVoices() || []) : []; } catch (e) { voices = []; } }
  if (synth) {
    load();
    try { synth.addEventListener('voiceschanged', load); } catch (e) { synth.onvoiceschanged = load; }
  }
  function norm(l) { return String(l || '').toLowerCase().replace('_', '-'); }
  function l2of(l) { return norm(l).split('-')[0]; }
  function prefGet(l2) { try { return localStorage.getItem('hby_voice_' + l2) || ''; } catch (e) { return ''; } }
  function prefSet(l2, name) { try { if (name) localStorage.setItem('hby_voice_' + l2, name); else localStorage.removeItem('hby_voice_' + l2); } catch (e) { /* noop */ } }

  /* ---- 목소리 성별 추정 (Web Speech API는 성별을 알려주지 않아 이름으로 추정) ---- */
  const FEMALE_RE = /\bfemale\b|\bwoman\b|\bzira\b|\baria\b|\bjenny\b|\bmichelle\b|\bana\b|\bemma\b|\bava\b|\bsamantha\b|\bvictoria\b|\ballison\b|\bsusan\b|\bnicky\b|\bzoe\b|\bjoelle\b|\bkate\b|\bkaren\b|\byuna\b|\bsunhi\b|\bheami\b|\bjimin\b|\bseohyeon\b|\bsoonbok\b|\byujin\b|\bhoaimy\b|\blinh\b|google (us english|한국어|korean|tiếng việt|vietnamese)/i;
  const MALE_RE = /\bmale\b|\bman\b|\bdavid\b|\bmark\b|\bguy\b|\bchristopher\b|\beric\b|\broger\b|\bsteffan\b|\bbrian\b|\bandrew\b|\balex\b|\bfred\b|\btom\b|\baaron\b|\bevan\b|\bnathan\b|\binjoon\b|\bbongjin\b|\bgookmin\b|\bhyunsu\b|\bnamminh\b/i;
  function genderOf(v) {
    const g0 = String((v && v.gender) || '').toLowerCase();   // 브라우저가 gender를 알려주면 그 값을 우선 사용
    if (g0 === 'male' || g0 === 'female') return g0;
    const n = String((v && v.name) || '');
    if (FEMALE_RE.test(n)) return 'female';
    if (MALE_RE.test(n)) return 'male';
    return '';
  }
  /* ---- 음질 점수: 자연스러운(Neural/Natural/Online/Google 등) 음성을 우선, 로봇 음성은 뒤로 ---- */
  function qualityOf(v) {
    const n = String((v && v.name) || '');
    let q = 0;
    if (/natural|neural|online|premium|enhanced|siri|studio|wavenet/i.test(n)) q += 40;
    if (/google/i.test(n)) q += 25;
    if (/compact|espeak|novelty|eloquence/i.test(n)) q -= 60;
    if (!v.localService) q += 5;
    if (v.default) q += 1;
    return q;
  }
  function candidates(lang) {
    const l = norm(lang), pre = l2of(lang);
    const exact = voices.filter(v => norm(v.lang) === l);
    if (pre === 'en') return exact;            // 영어는 미국식(en-US)만 후보 — 영국·인도식 자동 선택 방지
    if (exact.length) return exact;
    return voices.filter(v => norm(v.lang).indexOf(pre) === 0);
  }
  /** 사용자가 직접 고른 음성 → 없으면 (성별 일치 + 음질) 최고점 음성 */
  function pick(lang) {
    if (!voices.length) load();
    const l2 = l2of(lang);

    return '<div class="item" aria-current="' + (!!S.cur && keyOf(S.cur) === keyOf(w)) + '"><button class="pick" data-k="' + esc(keyOf(w)) + '"><div class="t1">' + esc(first(t.text)) + '</div><div class="t2">' + esc(S.mode === 'example' ? ((itemsOf(w)[0] || {}).text || '') : othersText(w)) + '</div></button></div>';
  }).join('') : '<p class="muted">단어가 없어요.</p>';
}

/* ---------- 결과 화면 부품 ---------- */
function isActive() { return !!(S.pron && ['requesting', 'listening', 'retrying', 'processing'].indexOf(S.pron.status) !== -1); }
function grade(s) {
  return s >= 80 ? { c: 'good', msg: '아주 좋아요!' } : (s >= 55 ? { c: 'mid', msg: '조금만 더 또렷하게!' } : { c: 'low', msg: '다시 한 번 천천히 해볼까요?' });
}
function hl(arr) { return arr.map(x => x.ok ? esc(x.c) : '<span class="x">' + (x.c === ' ' ? '␣' : esc(x.c)) + '</span>').join(''); }
/** [5] 베트남어·한국어·영어 3줄. 점검 대상 언어는 크게 + 🎯 */
function wordBlock(w, tl) {
  const rows = [['vi', '베트남어', w.vi], ['ko', '한국어', w.ko], ['en', '영어', w.en]];
  return '<div class="wtri">' + rows.map(r => '<div class="wrow' + (r[0] === tl ? ' on' : '') + '"><span class="lg">' + r[1] + '</span><span class="tx" lang="' + r[0] + '">' + (esc(r[2]) || '<span class="muted">—</span>') + '</span>' + (r[0] === tl ? '<span class="tg">🎯 점검 대상</span>' : '') + '</div>').join('') + '</div>';
}
function detailHtml(p) {
  const d = p.detail;
  if (!d) return '<p class="muted" style="margin:8px 0 0">직접 평가한 점수예요 (자동 채점이 아니에요).</p>';
  const df = Pron.diff(d.target, d.heardNorm);
  let why;
  if (d.kind === 'vi') why = '성조 포함 일치율 ' + d.full + '% × 0.6 + 성조 제외 일치율 ' + d.bare + '% × 0.4 → <b>' + p.score + '점</b>';
  else if (d.kind === 'ko') why = '띄어쓰기·부호를 뺀 글자 일치율 ' + d.full + '% → <b>' + p.score + '점</b>';
  else why = '대소문자·부호를 뺀 글자 일치율 ' + d.full + '% → <b>' + p.score + '점</b>';
  const alts = (p.alts || []).slice(0, 5);
  return '<div class="cmp"><div><span class="k">목표</span><span class="v">' + hl(df.a) + '</span></div><div><span class="k">인식</span><span class="v">' + hl(df.b) + '</span></div></div>' +
    '<p class="why">' + why + '</p>' +
    '<p class="muted" style="margin:4px 0 0;text-align:left">빨간 글자 = 목표와 달라서 점수가 깎인 부분이에요 (목표에서 빠진 글자 / 인식에서 다르거나 더해진 글자). 글자 비교는 대소문자·부호를 뺀 상태로 해요.</p>' +
    (alts.length > 1 ? '<p class="muted" style="margin:6px 0 0;text-align:left">브라우저가 들은 후보 ' + alts.length + '개 중 목표와 가장 비슷한 것으로 채점했어요: ' + alts.map(a => '“' + esc(a) + '”').join(' / ') + '</p>' : '');
}
function critHtml() {
  return '<details class="crit" id="crit"' + (S.critOpen ? ' open' : '') + '><summary>채점 기준 보기</summary><div class="cb">' +
    '<p><b>어떻게 채점하나요?</b> 브라우저(Chrome 등)의 음성 인식이 내 말을 글자로 바꾸면, 그 글자가 목표 글자와 얼마나 같은지(편집 거리 유사도)를 0~100점으로 계산해요.</p>' +
    '<ul><li><b>베트남어</b>: 성조까지 같은지 60% + 성조를 뺀 글자가 같은지 40%</li><li><b>한국어</b>: 띄어쓰기·부호는 무시하고 글자 일치율</li><li><b>영어</b>: 대소문자·부호는 무시하고 글자 일치율</li><li>인식 후보를 최대 5개까지 받아 <b>가장 높은 점수</b>를 사용해요</li></ul>' +
    '<table class="gtab"><tr><td class="good">80~100점</td><td>아주 좋아요</td></tr><tr><td class="mid">55~79점</td><td>조금만 더 또렷하게</td></tr><tr><td class="low">0~54점</td><td>다시 한 번 천천히</td></tr></table>' +
    '<p class="muted"><b>알아두세요</b>: 억양·세기 같은 소리 자체를 분석하는 것이 아니라 “알아들은 글자”로 비교해요. 주변 소음이나 인식 오류로 점수가 달라질 수 있어요. 점수는 <b>단어</b> 점검일 때만 시트에 저장돼요(예문은 저장 안 함).</p></div></details>';
}
function audioHtml(p) {
  if (!p.rec) return '';
  const a = S.aud && S.aud.tok === p.tok ? S.aud : null;
  if (!a) return '<p class="muted" style="margin:8px 0">내 발음 녹음 처리 중…</p>';
  if (!a.url) return '<p class="muted" style="margin:8px 0">' + esc(a.msg || '이 기기에서는 녹음을 만들지 못했어요. 점수는 정상이에요.') + '</p>';
  return '<div class="row" style="justify-content:center;margin:10px 0 4px"><button class="btn' + (S.playing ? ' playing' : '') + '" id="mine">' + (S.playing ? IC_STOP + ' 멈추기' : IC_SPK + ' 내 발음 듣기') + '</button></div>' +
    (a.err ? '<p class="muted" style="color:var(--bad);margin:0">' + esc(a.err) + '</p>' : '');
}
function navHtml() {
  const ls = filtered();
  const i = S.cur ? ls.findIndex(x => keyOf(x) === keyOf(S.cur)) : -1;
  return '<div class="navbar"><button class="btn" id="prev">← 이전</button><span class="muted" aria-live="polite">' + (i >= 0 ? (i + 1) + ' / ' + ls.length : ls.length + '개') + '</span><button class="btn primary" id="next">다음 →</button></div>';
}

function stage() {
  const w = S.cur; if (!w) return;
  const its = itemsOf(w), t = curItem(w), p = S.pron, tl = tgt();
  if (!t) {
    $('#stage').innerHTML = '<p class="muted">이 단어는 선택한 문체의 예문이 아직 없어요. 연습 대상을 바꿔보세요.</p>' + navHtml();
    bindNav(); return;
  }
  const txt = t.kind === 'word' ? first(t.text) : t.text;
  let h = '';
  if (its.length > 1) h += '<div class="row" style="justify-content:center;margin-bottom:10px" role="group" aria-label="연습 항목">' + its.map(x => '<button class="btn' + (x.id === t.id ? ' primary' : '') + '" data-item="' + x.id + '" aria-pressed="' + (x.id === t.id) + '">' + esc(x.label) + '</button>').join('') + '</div>';
  else h += '<p class="muted" style="margin:0 0 6px">' + esc(t.label) + '</p>';
  if (t.kind === 'word') {
    h += wordBlock(w, tl);
    if (txt !== t.text) h += '<p class="muted" style="margin:6px 0 0">🎤 점검할 말: <b>' + esc(txt) + '</b></p>';
  } else {
    h += '<div class="target sm" lang="' + t.lang.slice(0, 2) + '">' + esc(txt) + '</div><p class="muted">' + esc(t.mean) + '</p>' +
      '<p class="muted" style="margin:8px 0 0">단어 · 베트남어 ' + esc(w.vi || '—') + ' / 한국어 ' + esc(w.ko || '—') + ' / 영어 ' + esc(w.en || '—') + '</p>';
  }
  h += '<div class="row" style="justify-content:center;margin:14px 0 8px"><button class="btn icon" id="spk" aria-label="원어 발음 듣기" title="원어 발음 듣기">' + IC_SPK + '</button>';
  if (p && (p.status === 'listening' || p.status === 'requesting' || p.status === 'retrying')) h += '<button class="btn rec pulse" id="stopMic">' + IC_STOP + ' ' + (p.status === 'requesting' ? '마이크 준비 중…' : p.status === 'retrying' ? '다시 듣는 중… 말씀해 주세요' : '듣는 중… 말이 끝나면 자동 채점') + '</button>';
  else h += '<button class="btn primary" id="mic">' + IC_MIC + ' 발음 점검</button>';
  h += '</div>';
  if (recSupported()) h += '<label class="rectog"><input type="checkbox" id="recTog"' + (recOn() ? ' checked' : '') + '> 내 발음 녹음해서 다시 듣기</label>';
  else h += '<p class="muted rectog">이 기기에서는 내 발음 다시 듣기를 지원하지 않아요.</p>';
  if (S.note) h += '<p class="muted" style="margin:0 0 8px">' + esc(S.note) + '</p>';
  if (p && p.status === 'processing') h += '<p><span class="spin"></span> 채점 중…</p>';
  if (p && p.status === 'done') {
    const g = grade(p.score);
    const sv = p.kind !== 'word' ? '예문 점수는 시트에 저장하지 않아요' : (p.saved === true ? '시트에 저장했어요' : p.saved === false ? '시트 저장에 실패했어요: ' + esc(p.saveErr || '') : '저장 중…');
    h += '<div class="res"><div class="big ' + g.c + '">' + p.score + '<small>점</small></div><p style="margin:0 0 6px"><b>' + g.msg + '</b></p><p class="muted" style="margin:0">인식된 말: “' + esc(p.heard) + '”</p>' +
      audioHtml(p) + detailHtml(p) + '<p class="muted" style="margin:8px 0 0">' + sv + '</p></div>';
  }
  if (p && p.status === 'error') {
    const i = p.info;
    h += '<div class="err"><p><b>' + esc(i.title) + '</b> <span class="muted">(' + esc(i.code) + ')</span></p><p>' + esc(i.tip) + '</p>' + (i.detail ? '<p class="muted">' + esc(i.detail) + '</p>' : '') + '</div>';
    if (p.rec && i.key === 'no-speech') h += '<div class="row" style="justify-content:center;margin-top:10px"><button class="btn" id="norec">녹음 끄고 다시 시도</button></div><p class="muted">일부 기기는 녹음 때문에 음성 인식이 안 될 수 있어요.</p>';
    if (i.fallback) h += '<div class="row" style="justify-content:center;margin-top:10px"><span class="muted">직접 평가:</span><button class="btn" data-self="90">잘했어요</button><button class="btn" data-self="65">보통</button><button class="btn" data-self="35">다시</button></div>';
  }
  h += critHtml() + navHtml();
  $('#stage').innerHTML = h;
  bindStage(w, t, txt);
}
function bindNav() {
  const pv = $('#prev'), nx = $('#next');
  if (pv) pv.onclick = () => go(-1);
  if (nx) nx.onclick = () => go(1);
}
function bindStage(w, t, txt) {
  const spk = $('#spk'); if (spk) spk.onclick = () => { stopMine(); Voice.speak(txt, { id: 'w', lang: t.lang, repeat: 1, rate: (t.lang.indexOf('vi') === 0 ? 0.6 : (t.lang.indexOf('ko') === 0 ? 0.8 : 0.7)), kind: t.kind === 'ex' ? 'sentence' : 'word' }); };
  const mic = $('#mic'); if (mic) mic.onclick = start;
  const st = $('#stopMic'); if (st) st.onclick = () => { if (S.ctl) S.ctl.stop(); };
  const mine = $('#mine'); if (mine) mine.onclick = playMine;
  const rt = $('#recTog'); if (rt) rt.onchange = () => { lsSet(REC_KEY, rt.checked ? '' : '1'); S.note = ''; };
  const nr = $('#norec'); if (nr) nr.onclick = () => { lsSet(REC_KEY, '1'); S.note = '녹음을 껐어요. 이제 인식만 사용해요.'; start(); };
  const cr = $('#crit'); if (cr) cr.addEventListener('toggle', () => { S.critOpen = cr.open; });
  document.querySelectorAll('[data-item]').forEach(b => { b.onclick = () => { resetPron(); S.item = b.getAttribute('data-item'); stage(); }; });
  document.querySelectorAll('[data-self]').forEach(b => { b.onclick = () => {
    const score = Number(b.getAttribute('data-self'));
    const tok = ++TOK;
    resetPron(false);
    S.pron = { status: 'done', tok: tok, rec: false, score: score, heard: '(직접 평가)', alts: [], detail: null, kind: t.kind };
    if (t.kind === 'word') save(S.cur, score, tok);
    stage();
  }; });
  bindNav();
}
async function save(w, score, tok) {
  const prev = (w.scoresByUser[S.user] || []).filter(x => x !== '' && x !== null);
  const scores = [score].concat(prev).slice(0, 3);
  w.scoresByUser[S.user] = scores;
  const mine = () => (S.pron && S.pron.tok === tok) ? S.pron : null;
  try {
    const t0 = Date.now();
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ type: 'pronounce_history', user: S.user, row: w.row, key: keyOf(w), scores: scores, t: TOKEN || undefined }) });
    const o = await r.json();
    trace('pronounce_history', Date.now() - t0, o.status === 'success' ? 'ok' : '오류 ' + (o.code || ''), o.runId);
    if (o.status !== 'success') { dlog(o.code || 'E005', 'save', o.message || '저장 실패', o.runId); throw new Error(o.message || '저장 실패'); }
    const m = mine(); if (m) m.saved = true;
  } catch (e) { dlog('E005', 'save', e && e.message); const m = mine(); if (m) { m.saved = false; m.saveErr = e.message; } }
  stage();
}

/* ---------- 점검 시작 ---------- */
function abortCtl() { if (S.ctl) { try { S.ctl.abort(); } catch (e) { /* 무시 */ } S.ctl = null; } }
/** 진행 중인 점검·녹음·재생을 모두 정리(단어/항목을 바꿀 때) */
function resetPron(clearPron) {
  abortCtl(); TOK++; freeAudio(); S.note = '';
  try { Voice.stop(); } catch (e) { /* noop */ }
  if (clearPron !== false) S.pron = null;
}
function start() {
  const w = S.cur; if (!w) return;
  const t = curItem(w); if (!t) return;
  const txt = t.kind === 'word' ? first(t.text) : t.text;
  abortCtl(); freeAudio(); S.note = '';
  const tok = ++TOK;
  const useRec = recOn();
  S.pron = { status: 'requesting', tok: tok, rec: useRec };
  stage();
  const run = rec => {
    S.ctl = Pron.start({
      text: txt, lang: t.lang, record: rec, silenceMs: Number(lsGet('hby_sil')) || 1200, timeoutMs: t.kind === 'ex' ? 14000 : 8000,
      onState: s => { if (tok !== TOK) return; if (S.pron) { S.pron.status = s; stage(); } },
      onAudio: blob => {
        if (tok !== TOK) return;
        S.aud = blob ? { tok: tok, url: URL.createObjectURL(blob) } : { tok: tok, url: '', msg: '이 기기에서는 녹음을 만들지 못했어요. 점수는 정상이에요.' };
        if (S.pron && S.pron.status === 'done') stage();
      },
      onDone: r => {
        if (tok !== TOK) return;
        S.ctl = null;
        S.pron = { status: 'done', tok: tok, rec: rec, score: r.score, heard: r.heard, alts: r.alts, detail: r.detail, kind: t.kind };
        stage();
        if (rec) setTimeout(() => { if (tok === TOK && !(S.aud && S.aud.tok === tok)) { S.aud = { tok: tok, url: '', msg: '녹음이 만들어지지 않았어요. 점수는 정상이에요.' }; stage(); } }, 4000);
        if (t.kind === 'word') save(w, r.score, tok);
      },
      onFail: i => {
        if (tok !== TOK) return;
        S.ctl = null;
        if (rec && (i.key === 'audio-capture' || i.key === 'start-timeout')) {
          // 녹음과 음성 인식을 함께 못 쓰는 기기: 녹음을 끄고 인식만 다시 시도
          lsSet(REC_KEY, '1');
          S.note = '이 기기는 녹음과 음성 인식을 함께 쓸 수 없어 “내 발음 다시 듣기”를 껐어요. 인식·채점은 그대로 쓸 수 있어요.';
          dlog('E014', '녹음', '녹음+인식 동시 사용 실패(' + i.key + ') → 녹음 끄고 재시도');
          S.pron = { status: 'requesting', tok: tok, rec: false };
          stage(); run(false); return;
        }
        S.pron = { status: 'error', tok: tok, rec: rec, info: i };
        dlog(i.code, '발음 점검', i.title + (i.detail ? ' / ' + i.detail : ''));
        stage();
      }
    });
  };
  run(useRec);
}

/* ---------- 이전 / 다음 ---------- */

  i = i < 0 ? (d > 0 ? 0 : ls.length - 1) : (i + d + ls.length) % ls.length;
  select(ls[i]);   // 마이크는 자동으로 켜지 않음 — 🎤 를 직접 누름
}

$('#style').addEventListener('change', e => { S.style = e.target.value; lsSet('hby_micstyle', S.style); S.item = S.mode === 'example' ? '' : 'word'; resetPron(); renderList(); if (S.cur) stage(); });
